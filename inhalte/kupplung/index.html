<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07051a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>REDLINE – Kupplung</title>
<style>
:root{
  --bg0:#07051a; --bg1:#120a33; --ink:#eef1ff; --mut:#8c93bd; --cy:#19e6ff; --mg:#ff2fd0; --am:#ffb52e; --gr:#37ff8b; --rd:#ff3b5c;
  --pn:rgba(16,11,46,.82); --line:rgba(140,150,255,.26); --top:52px;
  --font:"Bahnschrift","DIN Alternate","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;margin:0;height:100%;background:var(--bg0);color:var(--ink);font-family:var(--font);overscroll-behavior:none;-webkit-user-select:none;user-select:none;overflow:hidden}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#1c1052 0%,var(--bg0) 62%)}
button{font-family:inherit;color:inherit}
canvas{display:block}

#top{position:fixed;left:0;right:0;top:0;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:10px;z-index:5}
#topTitle{flex:1;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.06em;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(20,14,56,.8);font-size:24px;line-height:1;display:grid;place-items:center;cursor:pointer;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;background:rgba(20,14,56,.8);border:1px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums}
.chip:empty{display:none}
#btnBack{visibility:hidden}
body[data-screen=level] #btnBack{visibility:visible}

.scr{position:absolute;left:0;right:0;bottom:0;top:calc(var(--top) + env(safe-area-inset-top));display:none;padding:6px 12px calc(10px + env(safe-area-inset-bottom));z-index:2;flex-direction:column;min-height:0}
.scr.active{display:flex}
.card{background:var(--pn);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.btn{border:1px solid rgba(140,150,255,.4);background:linear-gradient(180deg,rgba(62,50,150,.92),rgba(26,18,74,.96));border-radius:14px;padding:12px 18px;font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.05em;font-size:14px;cursor:pointer;min-height:44px;transition:transform .08s}
.btn:active{transform:scale(.97) translateY(1px)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.primary{border-color:rgba(255,255,255,.55);background:linear-gradient(120deg,#19e6ff,#6a5cff 55%,#ff2fd0);color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.45);box-shadow:0 0 18px rgba(25,230,255,.35)}
.btn.big{font-size:18px;padding:14px 26px;min-height:52px}

/* Menü */
.menuWrap{width:100%;max-width:820px;margin:0 auto;overflow:auto;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.hero{text-align:center;padding:6px 0 14px}
.logo{font-size:clamp(40px,9vw,66px);font-weight:900;font-style:italic;letter-spacing:.04em;line-height:1;text-shadow:0 0 28px rgba(25,230,255,.35)}
.logo span{color:var(--mg);text-shadow:0 0 28px rgba(255,47,208,.55)}
.tag{margin-top:6px;color:var(--mut);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
.world{padding:14px 14px 16px;margin-bottom:12px}
.wHead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.wHead b{font-size:17px;letter-spacing:.06em;text-transform:uppercase;font-style:italic}
.schild{font-size:12px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border-radius:9px;border:1px solid}
.schild.k{color:var(--cy);border-color:var(--cy);box-shadow:0 0 10px rgba(25,230,255,.35)}
.schild.s{color:var(--mg);border-color:var(--mg);box-shadow:0 0 10px rgba(255,47,208,.35)}
.wSub{color:var(--mut);font-size:13px;margin-bottom:10px;line-height:1.35}
.lvGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.lv{border:1px solid var(--line);background:linear-gradient(180deg,rgba(50,40,130,.55),rgba(20,14,60,.7));border-radius:14px;padding:10px 10px 8px;text-align:left;cursor:pointer;min-height:74px}
.lv:active{transform:scale(.97)}
.lv .no{font-size:12px;color:var(--mut);font-weight:800}
.lv .nm{font-weight:800;font-size:15px;margin:1px 0 3px}
.lv .st{letter-spacing:2px;font-size:16px;color:#4a4a78}
.lv .st i{font-style:normal}
.lv .st i.on{color:var(--am);text-shadow:0 0 8px rgba(255,181,46,.6)}

/* Level */
#goal{display:flex;align-items:center;gap:12px;padding:8px 14px;flex:none}
#goalTxt{flex:1;font-weight:800;font-size:15px;line-height:1.25}
#goalTxt small{display:block;color:var(--mut);font-weight:600;font-size:12px}
#tries{font-weight:800;font-size:13px;color:var(--mut);text-align:right;white-space:nowrap}
#tries b{color:var(--am);letter-spacing:2px}
#stage{position:relative;flex:1;min-height:150px;margin:8px 0;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#0a0724}
#stage canvas{position:absolute;inset:0;width:100%;height:100%}
#ctrl{display:flex;align-items:center;gap:14px;padding:10px 14px;flex:none}
.cMain{flex:1;min-width:0}
.cLab{font-weight:800;font-size:13px;color:var(--mut);letter-spacing:.04em;margin-bottom:4px;line-height:1.2}
.cRow{display:flex;align-items:center;gap:10px}
.cVal{min-width:96px;text-align:right;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--cy);text-shadow:0 0 14px rgba(25,230,255,.5)}
input[type=range]{flex:1;min-width:0;height:44px;-webkit-appearance:none;appearance:none;background:transparent;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(25,230,255,.55),rgba(255,47,208,.55))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;background:#fff;border:3px solid var(--cy);box-shadow:0 0 14px rgba(25,230,255,.8)}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(90deg,rgba(25,230,255,.55),rgba(255,47,208,.55))}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--cy)}
body.running #ctrl{opacity:.45;pointer-events:none}

/* Fenster */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(5,3,20,.72);backdrop-filter:blur(3px)}
#modal.show{display:flex}
#modalCard{width:100%;max-width:540px;max-height:100%;overflow:auto;padding:18px 18px 16px;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
#modalCard h2{margin:0 0 6px;font-size:26px;font-style:italic;font-weight:900;letter-spacing:.04em;text-transform:none}
#modalCard h2.win{color:var(--gr);text-shadow:0 0 16px rgba(55,255,139,.45)}
#modalCard h2.lose{color:var(--rd);text-shadow:0 0 16px rgba(255,59,92,.4)}
#modalCard p{margin:6px 0;line-height:1.4;font-size:15px}
.stars{font-size:34px;letter-spacing:6px;color:#3c3c66;margin:2px 0 4px}
.stars i{font-style:normal}
.stars i.on{color:var(--am);text-shadow:0 0 14px rgba(255,181,46,.7)}
.mBtns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.mBtns .btn{flex:1;min-width:110px}
.waage{margin:10px 0 4px;border:1px solid var(--line);border-radius:14px;padding:8px 10px 6px;background:rgba(8,5,30,.6)}
.waage h3{margin:0 0 2px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.waage svg{display:block;width:100%;height:auto}
.evl{font-size:13px;color:#c9cdf0;line-height:1.5;margin-top:4px;font-variant-numeric:tabular-nums}
.sumline{font-weight:800;font-size:14px;margin-top:2px}
.sumline.good{color:var(--gr)}

@media (max-width:640px){
  #ctrl{flex-wrap:wrap}
  #btnGo{width:100%}
  .cVal{min-width:80px;font-size:22px}
}
@media (orientation:portrait) and (max-width:640px){
  #stage::after{content:"Querformat ist besser ⟳";position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--mut);font-weight:700}
}

.ico.sm{width:34px;height:34px;font-size:18px;font-weight:900;color:var(--am);border-radius:10px}
.tutRow{display:flex;gap:10px;align-items:baseline;margin:6px 0;font-size:15px;line-height:1.35}
.tg{flex:none;min-width:78px;text-align:center;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:8px;border:1px solid var(--cy);color:var(--cy)}
.tg.s{border-color:var(--am);color:var(--am)}
.tutEx{margin:10px 0;padding:10px 12px;border-radius:12px;background:rgba(8,5,30,.6);border:1px solid var(--line);line-height:1.7;font-size:15px;font-variant-numeric:tabular-nums}
.tutEx b{color:var(--gr)}

#btnHelp{width:26px;height:26px;font-size:14px;font-style:italic;font-family:Georgia,serif;font-weight:700;color:var(--mut);background:transparent;border:1px solid rgba(140,150,255,.3);border-radius:50%;opacity:.7;align-self:flex-start;margin-top:2px}
#btnHelp:active{opacity:1}
.given{margin-top:4px;font-size:17px;font-weight:800;color:var(--cy)}
.given b{font-size:21px;text-shadow:0 0 12px rgba(25,230,255,.55)}

</style>
</head>
<body data-screen="menu">
<div id="app">
  <header id="top">
    <button class="ico" id="btnBack" aria-label="Zurück">‹</button>
    <div id="topTitle">REDLINE · KUPPLUNG</div>
    <span class="chip" id="stStars"></span>
  </header>

  <section class="scr active" id="scrMenu">
    <div class="menuWrap">
      <div class="hero">
        <div class="logo">KUPP<span>LUNG</span></div>
        <div class="tag">Rechne den Stoß. Triff das Ziel.</div>
      </div>
      <div id="worlds"></div>
    </div>
  </section>

  <section class="scr" id="scrLevel">
    <div id="goal" class="card"><div id="goalTxt"></div><div id="tries"></div><button class="ico sm" id="btnHelp" aria-label="Info zum Aufgabentyp" title="Info">i</button></div>
    <div id="stage"><canvas id="cv"></canvas></div>
    <div id="ctrl" class="card">
      <div class="cMain">
        <div class="cLab" id="cLab"></div>
        <div class="cRow">
          <button class="ico" id="cMinus" aria-label="weniger">−</button>
          <input type="range" id="cRange">
          <button class="ico" id="cPlus" aria-label="mehr">+</button>
          <div class="cVal" id="cVal"></div>
        </div>
      </div>
      <button class="btn primary big" id="btnGo">▶ GO</button>
    </div>
  </section>

  <div id="modal"><div class="card" id="modalCard"></div></div>
</div>
<script>
/* KUPPLUNG – Physik-Kern (rein, ohne Oberfläche, im Browser und in Node nutzbar)
   Eindimensional. Wagen sind Kästen der Länge KW, ohne Reibung.
   Welt 1 "klebt": vollständig inelastischer Stoß → Klumpen mit v' = Σ(m·v) / Σm.
   Welt 2 "stößt ab": Sprengbolzen trennt gekoppelte Wagen, Impuls bleibt erhalten, v_B − v_A = u.
   Energie kommt nirgends vor. Rechts ist positiv. */
'use strict';
const KW = 8;                       // Wagenlänge in m
const KCOL = ['#19e6ff', '#ff2fd0', '#ffb52e', '#37ff8b', '#a98bff'];

const LEVELS = [
  /* ---------------- Welt 1: klebt ---------------- */
  { id: 1, world: 1, title: 'Anhänger', typ: 'tor', stoss: 'klebt',
    text: 'Du rammst den Laster. Klack – die beiden kleben und rollen als ein Klumpen weiter. Der Klumpen soll durchs Tor, genau mit dem Soll-Tempo. Stell dein Tempo ein.',
    veh: [{ id: 'du', name: 'DU', m: 2, v: 0, x: 0, face: 1 }, { id: 'b', name: 'Laster', m: 3, v: 0, x: 45, face: -1 }],
    input: { kind: 'v', veh: 'du', min: 0, max: 20, step: 1, start: 8, unit: 'm/s', label: 'Dein Tempo v₀' },
    goal: { type: 'gate', veh: 'any', vT: 6, tol: 0.2, dx: 25 }, sol: 15, hint: true },
  { id: 2, world: 1, title: 'Aufholjagd', typ: 'tor', stoss: 'klebt',
    text: 'Der Laster rollt schon. Hol ihn ein, kleb dich dran und fahr als Klumpen durchs Tor.',
    veh: [{ id: 'du', name: 'DU', m: 3, v: 0, x: 0, face: 1 }, { id: 'b', name: 'Laster', m: 2, v: 5, x: 24, face: 1 }],
    input: { kind: 'v', veh: 'du', min: 0, max: 20, step: 1, start: 8, unit: 'm/s', label: 'Dein Tempo v₀' },
    goal: { type: 'gate', veh: 'any', vT: 8, tol: 0.2, dx: 25 }, sol: 10, hint: true },
  { id: 3, world: 1, title: 'Ladung', typ: 'masse', stoss: 'klebt',
    text: 'Dein Tempo ist fest. Dafür darfst du Ladung zuladen. Wie schwer muss dein Wagen sein? Ab jetzt gibt es keine Vorschau mehr.',
    veh: [{ id: 'du', name: 'DU', m: 3, v: 12, x: 0, face: 1 }, { id: 'b', name: 'Laster', m: 4, v: 0, x: 36, face: -1 }],
    input: { kind: 'm', veh: 'du', min: 1, max: 6, step: 1, start: 4, unit: 't', label: 'Deine Masse (mit Ladung)' },
    goal: { type: 'gate', veh: 'any', vT: 4, tol: 0.2, dx: 25 }, sol: 2 },
  { id: 4, world: 1, title: 'Gegenverkehr', typ: 'stand', stoss: 'klebt',
    text: 'Frontal! Nach dem Klack soll der Klumpen stehen bleiben – mitten im Parkfeld. Achte auf die Richtungen.',
    veh: [{ id: 'du', name: 'DU', m: 2, v: 0, x: 0, face: 1 }, { id: 'b', name: 'Laster', m: 4, v: -10, x: 100, face: -1 }],
    input: { kind: 'v', veh: 'du', min: 0, max: 30, step: 1, start: 12, unit: 'm/s', label: 'Dein Tempo v₀' },
    goal: { type: 'stop', veh: 'du', tol: 0.15, zh: 14 }, sol: 20 },
  { id: 5, world: 1, title: 'Kette', typ: 'kette', stoss: 'klebt',
    text: 'Zwei Stöße hintereinander. Am Ende fährt ein einziger Klumpen mit Soll-Tempo durchs Tor.',
    veh: [{ id: 'du', name: 'DU', m: 2, v: 0, x: 0, face: 1 }, { id: 'b', name: 'Wagen', m: 2, v: 0, x: 40, face: -1 }, { id: 'c', name: 'Laster', m: 4, v: -2, x: 110, face: -1 }],
    input: { kind: 'v', veh: 'du', min: 0, max: 30, step: 1, start: 12, unit: 'm/s', label: 'Dein Tempo v₀' },
    goal: { type: 'gate', veh: 'any', vT: 4, tol: 0.2, dx: 32 }, sol: 20 },
  /* ---------------- Welt 2: stößt ab (Start aus der Ruhe, Σp = 0) ---------------- */
  { id: 6, world: 2, title: 'Rückstoß', typ: 'rueck', stoss: 'stößt ab',
    text: 'A und B kleben noch und stehen still. Gleich zündet der Sprengbolzen – dann stoßen sich die beiden ab. Der schwere Wagen B soll mit dem Soll-Tempo durchs Tor. Du legst fest, wie schnell A nach links wegfährt.',
    veh: [{ id: 'a', name: 'A', m: 1, v: 0, x: 0, face: 1 }, { id: 'b', name: 'B', m: 3, v: 0, x: 8, face: 1 }],
    couple: [['a', 'b']], split: { t: 1.5, a: 'a', b: 'b' },
    input: { kind: 'va', min: -20, max: 0, step: 1, start: -4, unit: 'm/s', label: 'Tempo von A nach dem Start' },
    goal: { type: 'gate', veh: 'b', vT: 3, tol: 0.2, dx: 16 }, sol: -9 },
  { id: 7, world: 2, title: 'Ladung für B', typ: 'rueckm', stoss: 'stößt ab',
    text: 'Wieder startet alles aus der Ruhe. Diesmal ist bekannt, wie A nach dem Start fährt. Du wählst die Masse von B (Ladung), damit B mit dem Soll-Tempo durchs Tor kommt.',
    veh: [{ id: 'a', name: 'A', m: 2, v: 0, x: 0, face: 1 }, { id: 'b', name: 'B', m: 3, v: 0, x: 8, face: 1 }],
    couple: [['a', 'b']], split: { t: 1.5, a: 'a', b: 'b', va: -8 },
    input: { kind: 'm', veh: 'b', min: 1, max: 8, step: 1, start: 3, unit: 't', label: 'Masse von B (mit Ladung)' },
    goal: { type: 'gate', veh: 'b', vT: 4, tol: 0.2, dx: 18 }, sol: 4 },
  { id: 8, world: 2, title: 'Raketenstufe', typ: 'rueck', stoss: 'stößt ab',
    text: 'B ist die kleine Rakete, A die schwere Stufe. Die Rakete soll mit dem Soll-Tempo durchs Tor. Wie schnell muss die Stufe A dafür nach links wegfahren?',
    veh: [{ id: 'a', name: 'A', m: 3, v: 0, x: 0, face: 1 }, { id: 'b', name: 'B', m: 1, v: 0, x: 8, face: 1 }],
    couple: [['a', 'b']], split: { t: 1.5, a: 'a', b: 'b' },
    input: { kind: 'va', min: -10, max: 0, step: 1, start: -2, unit: 'm/s', label: 'Tempo von A nach dem Start' },
    goal: { type: 'gate', veh: 'b', vT: 12, tol: 0.2, dx: 30 }, sol: -4 },
];
LEVELS.forEach((L) => L.veh.forEach((o, i) => { o.col = KCOL[i % KCOL.length]; }));

const idxOf = (L, id) => L.veh.findIndex((o) => o.id === id);
const fmt = (v, d = 1) => (Math.abs(v) < 0.5 * Math.pow(10, -d) ? 0 : v).toFixed(d).replace('.', ',').replace('-', '−');

/* ---- Simulation: Ereignisse (Stoß / Sprengung) nacheinander, dazwischen gleichförmig ---- */
function simulate(L, val, opt) {
  const tMax = (opt && opt.tMax) || 40;
  const V = L.veh.map((o) => ({ id: o.id, m: o.m, v: o.v, x: o.x }));
  const inp = L.input;
  if (inp.kind === 'v') V[idxOf(L, inp.veh)].v = val;
  else if (inp.kind === 'm') V[idxOf(L, inp.veh)].m = val;
  const init = V.map((o) => ({ id: o.id, m: o.m, v: o.v, x: o.x }));
  const grp = V.map((_, i) => i);
  (L.couple || []).forEach((pair) => {
    const ii = pair.map((id) => idxOf(L, id));
    ii.forEach((i) => { grp[i] = grp[ii[0]]; V[i].v = V[ii[0]].v; });
  });
  let t = 0;
  const events = [];
  const tracks = V.map((o, i) => [{ t: 0, x: o.x, v: o.v, g: grp[i] }]);
  const push = () => V.forEach((o, i) => tracks[i].push({ t, x: o.x, v: o.v, g: grp[i] }));
  const members = (g) => V.map((_, i) => i).filter((i) => grp[i] === g);
  const snap = (g) => { const mm = members(g); return { ids: mm.map((i) => V[i].id), m: mm.reduce((s, i) => s + V[i].m, 0), v: V[mm[0]].v }; };
  let splitDone = !L.split;
  let nextG = V.length;
  for (let guard = 0; guard < 60; guard++) {
    const order = V.map((_, i) => i).sort((a, b) => V[a].x - V[b].x);
    let best = Infinity, pair = null;
    for (let k = 0; k < order.length - 1; k++) {
      const i = order[k], j = order[k + 1];
      if (grp[i] === grp[j]) continue;
      const closing = V[i].v - V[j].v;
      if (closing <= 1e-9) continue;
      const dt = Math.max(0, V[j].x - V[i].x - KW) / closing;
      if (dt < best) { best = dt; pair = [i, j]; }
    }
    const tSplit = splitDone ? Infinity : L.split.t;
    const tCol = pair ? t + best : Infinity;
    const adv = (to) => { const dt = to - t; V.forEach((o) => { o.x += o.v * dt; }); t = to; };
    if (tSplit <= tCol && tSplit < tMax) {
      adv(tSplit); splitDone = true;
      const ia = idxOf(L, L.split.a), ib = idxOf(L, L.split.b);
      const g0 = grp[ia];
      const mm = members(g0), M = mm.reduce((s, i) => s + V[i].m, 0), Vc = V[ia].v;
      const before = [snap(g0)];
      const x = V[ia].x + KW / 2;
      const va = inp.kind === 'va' ? val : L.split.va;
      V[ia].v = va;
      V[ib].v = (M * Vc - V[ia].m * va) / V[ib].m;
      grp[ib] = nextG++;
      events.push({ t, kind: 'split', x, before, after: [snap(grp[ia]), snap(grp[ib])] });
      push();
    } else if (pair && tCol < tMax) {
      adv(tCol);
      const [i, j] = pair;
      const gi = grp[i], gj = grp[j];
      const before = [snap(gi), snap(gj)];
      const mem = members(gi).concat(members(gj));
      const M = mem.reduce((s, k) => s + V[k].m, 0), P = mem.reduce((s, k) => s + V[k].m * V[k].v, 0);
      const x = (V[i].x + V[j].x) / 2;
      mem.forEach((k) => { V[k].v = P / M; grp[k] = gi; });
      events.push({ t, kind: 'couple', x, before, after: [snap(gi)] });

  c.fillStyle = '#fff6c0'; c.shadowColor = '#ffe27a'; c.shadowBlur = 8; c.fillRect(w / 2 - 3, bb - hh * 0.22, 3, hh * 0.14);
  c.fillStyle = '#ff3b5c'; c.shadowColor = '#ff3b5c'; c.fillRect(-w / 2, bb - hh * 0.22, 3, hh * 0.14);
  c.restore();
  c.save(); c.font = '900 ' + Math.max(10, Math.min(17, w * 0.2)) + 'px Bahnschrift,system-ui,sans-serif'; c.textAlign = 'center'; c.fillStyle = '#fff'; c.shadowColor = '#000'; c.shadowBlur = 4;
  c.fillText((nm ? nm + ' ' : '') + m + ' t', cx + (truck ? -w * 0.19 * face : 0), gy + bt - (truck ? hh * 0.0 : 0) + (bb - bt) * 0.72); c.restore();
}

function arrow(c, x, y, len, col) {
  if (Math.abs(len) < 2) return;
  const d = Math.sign(len);
  c.save(); c.strokeStyle = col; c.fillStyle = col; c.lineWidth = 3; c.shadowColor = col; c.shadowBlur = 10; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x, y); c.lineTo(x + len, y); c.stroke();
  c.beginPath(); c.moveTo(x + len + d * 7, y); c.lineTo(x + len - d * 3, y - 6); c.lineTo(x + len - d * 3, y + 6); c.closePath(); c.fill(); c.restore();
}

function draw(dtR) {
  if (!S.L || !S.sim) return;
  const c = ctx, L = S.L, v = view(), gy = v.gy, now = performance.now();
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = c.createLinearGradient(0, 0, 0, CH);
  g.addColorStop(0, '#07051a'); g.addColorStop(0.55, '#1a0f48'); g.addColorStop(gy / CH, '#2a1466'); g.addColorStop(Math.min(1, gy / CH + 0.001), '#0c0a2b'); g.addColorStop(1, '#07051a');
  c.fillStyle = g; c.fillRect(0, 0, CW, CH);
  c.save();
  if (S.shake > 0.01) { c.translate((Math.random() - 0.5) * 9 * S.shake, (Math.random() - 0.5) * 6 * S.shake); S.shake *= Math.pow(0.02, dtR || 0.016); }
  // Sterne und Skyline
  for (let i = 0; i < 46; i++) { const sx = (i * 137.5) % CW, sy = (i * 71.3) % (gy * 0.7); c.fillStyle = 'rgba(200,210,255,' + (0.15 + (i % 5) * 0.08) + ')'; c.fillRect(sx, sy, 1.5, 1.5); }
  for (let i = 0; i < 26; i++) { const bw = 14 + (i * 7) % 22, bx = i * (CW / 25) - 6, bh = 14 + (i * 29) % 56; c.fillStyle = 'rgba(70,50,160,.22)'; c.fillRect(bx, gy - bh, bw, bh); }
  // Boden
  c.fillStyle = '#0c0a2b'; c.fillRect(0, gy, CW, CH - gy);
  c.strokeStyle = '#19e6ff'; c.lineWidth = 2; c.shadowColor = '#19e6ff'; c.shadowBlur = 12; c.beginPath(); c.moveTo(0, gy); c.lineTo(CW, gy); c.stroke();
  c.shadowBlur = 0; c.strokeStyle = 'rgba(255,47,208,.55)'; c.lineWidth = 1; c.beginPath(); c.moveTo(0, gy + 7); c.lineTo(CW, gy + 7); c.stroke();
  c.fillStyle = '#8c93bd'; c.font = '600 10px Bahnschrift,system-ui,sans-serif'; c.textAlign = 'center';
  for (let x = Math.ceil(v.a / 10) * 10; v.X(x) < CW; x += 10) { c.strokeStyle = 'rgba(140,150,255,.4)'; c.beginPath(); c.moveTo(v.X(x), gy + 9); c.lineTo(v.X(x), gy + (x % 20 === 0 ? 17 : 13)); c.stroke(); if (x % 20 === 0) c.fillText(x + ' m', v.X(x), gy + 29); }
  // Parkfeld
  if (L.zone) {
    const z0 = v.X(L.zone[0]), z1 = v.X(L.zone[1]);
    const zg = c.createLinearGradient(0, gy - 90, 0, gy); zg.addColorStop(0, 'rgba(55,255,139,0)'); zg.addColorStop(1, 'rgba(55,255,139,.22)');
    c.fillStyle = zg; c.fillRect(z0, gy - 90, z1 - z0, 90);
    c.fillStyle = 'rgba(55,255,139,.16)'; c.fillRect(z0, gy + 36, z1 - z0, 22);
    c.strokeStyle = '#37ff8b'; c.lineWidth = 2; c.setLineDash([7, 5]); c.shadowColor = '#37ff8b'; c.shadowBlur = 8; c.strokeRect(z0, gy + 36, z1 - z0, 22); c.setLineDash([]); c.shadowBlur = 0;
    c.fillStyle = '#37ff8b'; c.font = '900 16px Bahnschrift,system-ui,sans-serif'; c.fillText('P · PARKFELD', (z0 + z1) / 2, gy + 52);
  }
  // Tor
  if (L.gx != null) {
    const gx = v.X(L.gx), dir = L.goal.vT >= 0 ? 1 : -1, top = gy - 128, col = S.hit ? (S.hit.ok ? '#37ff8b' : '#ff3b5c') : '#ffb52e';
    const zg = c.createLinearGradient(gx - 14 * dir, 0, gx + 2 * dir, 0); zg.addColorStop(0, 'rgba(255,181,46,0)'); zg.addColorStop(1, S.hit ? (S.hit.ok ? 'rgba(55,255,139,.3)' : 'rgba(255,59,92,.3)') : 'rgba(255,181,46,.26)');
    c.fillStyle = zg; c.fillRect(Math.min(gx, gx - 14 * dir), top, 14, gy - top);
    c.strokeStyle = col; c.lineWidth = 3; c.shadowColor = col; c.shadowBlur = 12; c.beginPath(); c.moveTo(gx, gy); c.lineTo(gx, top); c.stroke(); c.shadowBlur = 0;
    const txt = S.hit ? fmt(S.hit.v) + ' m/s ' + (S.hit.ok ? '✓' : '✗') : (dir > 0 ? '▶ ' : '◀ ') + fmt(L.goal.vT) + ' m/s';
    c.font = '900 13px Bahnschrift,system-ui,sans-serif'; const tw = c.measureText(txt).width + 18;
    c.fillStyle = 'rgba(10,8,40,.92)'; rr(c, gx - tw / 2, top - 26, tw, 24, 8); c.fill(); c.strokeStyle = col; c.lineWidth = 2; c.stroke();
    c.fillStyle = col; c.textAlign = 'center'; c.fillText(txt, gx, top - 9);
    c.font = '800 10px Bahnschrift,system-ui,sans-serif'; c.fillStyle = '#8c93bd'; c.fillText('TOR', gx, top - 32);
  }
  // Wagen
  const st = stateAt(S.sim, S.t), w = KW * v.sc;
  const groups = groupsAt(S.sim, S.t);
  groups.forEach((gr) => {
    if (gr.mem.length > 1) {
      const xs = gr.mem.map((i) => st[i].x).sort((a, b) => a - b);
      for (let k = 0; k < xs.length - 1; k++) {
        const lx = v.X((xs[k] + xs[k + 1]) / 2 + KW / 2), isBolt = !!L.split;
        c.save(); c.shadowColor = isBolt ? '#ffb52e' : '#fff'; c.shadowBlur = 14; c.fillStyle = isBolt ? '#ffb52e' : '#ffffff';
        c.fillRect(lx - 3, gy - w * 0.26, 6, w * 0.16); c.restore();
      }
    }
  });
  const hmax = (m) => w * Math.min(0.62, 0.3 + 0.05 * m) * (m >= 3 ? 1.0 : 1.0) + w * 0.17;
  st.forEach((s, i) => { const o = L.veh[i]; const vv = s.v; drawCar(c, v.X(s.x), gy, w, s.m, o.col, vv < -1e-6 ? -1 : vv > 1e-6 ? 1 : (o.face || 1), L.split ? o.name : ''); });
  const fs = Math.max(11, Math.min(15, CW / 70));
  groups.forEach((gr) => {
    const cx = gr.mem.reduce((a, i) => a + v.X(st[i].x), 0) / gr.mem.length;
    const top = gy - Math.max(...gr.mem.map((i) => hmax(st[i].m))) - 14;
    const col = L.veh[gr.mem[0]].col, name = gr.mem.length > 1 ? 'Klumpen' : L.veh[gr.mem[0]].name;
    arrow(c, cx, top, Math.max(-120, Math.min(120, gr.v * 3.6)), gr.v > 0 ? '#19e6ff' : '#ff2fd0');
    c.textAlign = 'center'; c.font = '800 ' + fs + 'px Bahnschrift,system-ui,sans-serif'; c.fillStyle = col;
    c.fillText(name + ' · ' + gr.m + ' t', cx, top - 34 + (gr.mem.length > 1 ? 0 : 0));
    c.font = '900 ' + (fs + 3) + 'px Bahnschrift,system-ui,sans-serif'; c.fillStyle = Math.abs(gr.v) < 1e-6 ? '#8c93bd' : '#fff';
    c.fillText(fmt(gr.v) + ' m/s', cx, top - 16);
  });
  // Bekanntes Tempo von A nach dem Start (groß, gut sichtbar)
  if (L.split && L.split.va != null && S.t < L.split.t) {
    const ga = groups.find((gr) => gr.mem.includes(idxOf(L, L.split.a)));
    if (ga) {
      const cx = ga.mem.reduce((a, i) => a + v.X(st[i].x), 0) / ga.mem.length, top = gy - Math.max(...ga.mem.map((i) => hmax(st[i].m))) - 14;
      const txt = 'A fährt mit ' + fmt(L.split.va) + ' m/s ' + (L.split.va < 0 ? '◀' : '▶');
      c.font = '900 ' + (fs + 4) + 'px Bahnschrift,system-ui,sans-serif'; const tw = c.measureText(txt).width + 24, by = top - 98;
      c.fillStyle = 'rgba(10,8,40,.94)'; rr(c, cx - tw / 2, by, tw, 34, 10); c.fill(); c.strokeStyle = '#19e6ff'; c.lineWidth = 2; c.shadowColor = '#19e6ff'; c.shadowBlur = 12; c.stroke(); c.shadowBlur = 0;
      c.fillStyle = '#19e6ff'; c.textAlign = 'center'; c.fillText(txt, cx, by + 23);
    }
  }
  // Sprengbolzen-Zähler
  if (L.split && S.t < L.split.t && S.running) { c.fillStyle = '#ffb52e'; c.font = '900 14px Bahnschrift,system-ui,sans-serif'; c.textAlign = 'center'; c.fillText('⚡ Sprengung in ' + fmt(L.split.t - S.t) + ' s', CW / 2, 22); }
  // Vorschau (Hilfe in Level 1–2)
  if (L.hint && !S.running && S.attempts >= 0) {
    const pv = previewSpeed(L, S.val);
    c.textAlign = 'center'; c.font = '800 13px Bahnschrift,system-ui,sans-serif'; c.fillStyle = '#ffb52e';
    c.fillText(pv == null ? 'Vorschau: kein Stoß – die Wagen verpassen sich' : 'Vorschau: Der Klumpen würde mit ' + fmt(pv) + ' m/s fahren', CW / 2, 22);
  }
  // Effekte
  S.fx = S.fx.filter((f) => now - f.born < 900);
  S.fx.forEach((f) => { const a = (now - f.born) / 900; c.globalAlpha = 1 - a; c.fillStyle = '#fff'; c.shadowColor = '#ff2fd0'; c.shadowBlur = 18; c.font = '900 ' + (22 + 10 * a) + 'px Bahnschrift,system-ui,sans-serif'; c.textAlign = 'center'; c.fillText(f.txt, f.x, f.y - 50 - 30 * a); c.globalAlpha = 1; c.shadowBlur = 0; });
  c.globalCompositeOperation = 'lighter';
  S.parts.forEach((p) => { p.age += dtR || 0; p.x += p.vx * (dtR || 0); p.y += p.vy * (dtR || 0); p.vy += 260 * (dtR || 0); const a = Math.max(0, 1 - p.age / p.life); c.globalAlpha = a; c.fillStyle = p.col; c.beginPath(); c.arc(p.x, p.y, 2.6 * a + 0.6, 0, 7); c.fill(); });
  c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  S.parts = S.parts.filter((p) => p.age < p.life);
  c.restore();
}

const TUT = [

function openTut(i) {
  S.tut = Math.max(0, Math.min(TUT.length - 1, i));
  const t = TUT[S.tut];
  let h = '<h2>' + t.title + '</h2>';
  if (t.gegeben) h += '<div class="tutRow"><span class="tg">gegeben</span><span>' + t.gegeben + '</span></div><div class="tutRow"><span class="tg s">gesucht</span><span>' + t.gesucht + '</span></div>';
  h += '<p>' + t.idee + '</p>';
  if (t.ex) h += '<div class="tutEx"><b>Beispiel</b><br>' + t.ex + '</div>';
  if (t.bars) h += '<div class="waage"><h3>Impuls-Waage zum Beispiel</h3>' + barsSVG(t.bars).svg + '</div>';
  h += '<div class="mBtns"><button class="btn primary" data-act="tut-close">Schließen</button></div>';

}

/* ---------------- Bedienung ---------------- */
$('worlds').addEventListener('click', (e) => { const t = e.target.closest('[data-tut]'); if (t) { openTut(+t.dataset.tut); return; } const b = e.target.closest('[data-lv]'); if (b) openLevel(+b.dataset.lv); });
$('btnHelp').addEventListener('click', () => { if (!S.running) openTut(Math.max(0, TUT.findIndex((t) => t.k === S.L.typ))); });
$('btnBack').addEventListener('click', toMenu);
$('btnGo').addEventListener('click', go);
$('cRange').addEventListener('input', (e) => { if (!S.running) setVal(+e.target.value); });
$('cMinus').addEventListener('click', () => { if (!S.running) setVal(S.val - S.L.input.step); });
$('cPlus').addEventListener('click', () => { if (!S.running) setVal(S.val + S.L.input.step); });
$('modalCard').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'brief') { P.seen[S.L.id] = 1; saveP(); closeModal(); }
  else if (a === 'again') { closeModal(); S.t = 0; S.hit = null; S.fx = []; S.parts = []; goal(); setVal(S.val); }
  else if (a === 'next') { if (S.li >= LEVELS.length - 1) toMenu(); else openLevel(S.li + 1); }
  else if (a === 'menu') toMenu();
  else if (a === 'tut-close') closeModal();
});
window.addEventListener('keydown', (e) => {
  if (document.body.dataset.screen !== 'level' || $('modal').classList.contains('show') || S.running) return;
  if (e.key === 'ArrowLeft') setVal(S.val - S.L.input.step);
  else if (e.key === 'ArrowRight') setVal(S.val + S.L.input.step);
  else if (e.key === 'Enter') go();
});
window.addEventListener('resize', () => { if (S.L && document.body.dataset.screen === 'level') { layout(); draw(0); } });
if (window.ResizeObserver) new ResizeObserver(() => { if (S.L && document.body.dataset.screen === 'level') { layout(); draw(0); } }).observe($('stage'));

window.__K = { S, LEVELS, TUT, openTut, openLevel, setVal, go: (fast) => { S.fast = !!fast; go(); S.fast = false; }, toMenu };
buildMenu();
